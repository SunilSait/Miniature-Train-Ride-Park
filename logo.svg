<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="38" fill="#2C5F2E" stroke="#D4A017" stroke-width="2"/>
  <!-- Track lines at bottom -->
  <rect x="10" y="62" width="60" height="3" rx="1.5" fill="#D4A017"/>
  <rect x="15" y="60" width="4" height="7" rx="0.5" fill="#D4A017"/>
  <rect x="25" y="60" width="4" height="7" rx="0.5" fill="#D4A017"/>
  <rect x="35" y="60" width="4" height="7" rx="0.5" fill="#D4A017"/>
  <rect x="45" y="60" width="4" height="7" rx="0.5" fill="#D4A017"/>
  <rect x="55" y="60" width="4" height="7" rx="0.5" fill="#D4A017"/>
  <!-- Locomotive body -->
  <rect x="14" y="44" width="38" height="16" rx="3" fill="#D4A017"/>
  <!-- Cab -->
  <rect x="38" y="38" width="14" height="22" rx="2" fill="#B8860B"/>
  <!-- Boiler -->
  <ellipse cx="31" cy="45" rx="16" ry="9" fill="#C8961B"/>
  <!-- Chimney -->
  <rect x="18" y="32" width="5" height="12" rx="2" fill="#2C5F2E"/>
  <!-- Chimney top -->
  <rect x="16" y="30" width="9" height="4" rx="2" fill="#2C5F2E"/>
  <!-- Steam puffs -->
  <circle cx="21" cy="26" r="3" fill="white" opacity="0.6"/>
  <circle cx="25" cy="22" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="29" cy="19" r="2" fill="white" opacity="0.25"/>
  <!-- Wheels -->
  <circle cx="26" cy="58" r="5" fill="#2C5F2E" stroke="#D4A017" stroke-width="1.5"/>
  <circle cx="26" cy="58" r="2" fill="#D4A017"/>
  <circle cx="40" cy="58" r="5" fill="#2C5F2E" stroke="#D4A017" stroke-width="1.5"/>
  <circle cx="40" cy="58" r="2" fill="#D4A017"/>
  <circle cx="52" cy="58" r="4" fill="#2C5F2E" stroke="#D4A017" stroke-width="1.5"/>
  <circle cx="52" cy="58" r="1.5" fill="#D4A017"/>
  <!-- Window on cab -->
  <rect x="42" y="40" width="8" height="7" rx="1" fill="#2C5F2E" stroke="#D4A017" stroke-width="0.8"/>
  <!-- Headlight -->
  <circle cx="14" cy="50" r="3" fill="#FFF8DC" stroke="#D4A017" stroke-width="0.8"/>
</svg>
