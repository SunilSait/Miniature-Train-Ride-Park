<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | TrainPark — Miniature Train Ride Park</title>
<meta name="description" content="Sign in to your Miniature Train Ride Park account to manage tickets, bookings, and party reservations.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<!-- Top Bar -->
<div class="auth-topbar" style="justify-content:flex-end;">
  <div style="display:flex;gap:0.5rem;align-items:center;">
    <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle text direction">
      <span class="dir-label" style="font-size:0.625rem;font-weight:700;">LTR</span>
    </button>
    <button class="auth-toggle-btn auth-theme-toggle" id="darkToggle" title="Toggle Theme" aria-label="Toggle dark mode">
      <svg id="iconSun" class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg id="iconMoon" class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<!-- Card -->
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;">
  <div class="auth-card">
    <!-- Decorative Ambient Orb -->
    <div style="position:absolute;top:-60px;right:-60px;width:140px;height:140px;background:rgba(44,95,46,0.12);border-radius:50%;filter:blur(30px);pointer-events:none;"></div>

    <!-- Logo -->
    <a href="index.html" class="auth-logo" aria-label="TrainPark Home">
      <img src="logo.svg" alt="TrainPark Logo" width="44" height="44">
      <div class="auth-logo-text">
        <span class="brand-top">TrainPark</span>
        <span class="brand-bottom">Ride &amp; Play</span>
      </div>
    </a>

    <!-- Header -->
    <div style="text-align:center;margin-bottom:1.75rem;">
      <h1 style="font-size:1.5rem;margin-bottom:0.375rem;color:var(--text-heading);font-family:var(--font-heading);">Welcome Back</h1>
      <p style="font-size:0.875rem;color:var(--text-muted);">Sign in to your account</p>
    </div>



    <!-- Form -->
    <form id="loginForm" onsubmit="event.preventDefault(); alert('Login successful!'); window.location.href='index.html';">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="checkbox-wrapper">
        <label class="form-check" for="rememberMe">
          <input type="checkbox" id="rememberMe">
          <span>Remember Me</span>
        </label>
        <a href="#" class="link-primary" onclick="event.preventDefault(); alert('Password reset link has been sent to your email.');">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" id="loginSubmitBtn">Sign In</button>
    </form>

    <!-- Footer link -->
    <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);">
      Don't have an account? <a href="signup.html" class="link-primary" id="loginSignupLink">Sign Up</a>
    </p>
  </div>
</main>

<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initAuthPage();
});
</script>
</body>
</html>
