<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Miniature Train Ride Park</title>
<meta name="description" content="Log in to your Miniature Train Ride Park account to manage bookings, party reservations and more.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-top-controls">
  <button class="nav-icon-btn" id="darkToggle" aria-label="Toggle theme">
    <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <a href="index.html" class="btn btn-outline btn-sm">← Back to Site</a>
</div>
<div class="auth-page">
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="auth-logo-wrap">
      <a href="index.html" class="auth-logo-link" aria-label="Home">
        <img src="logo.svg" alt="TrainPark Logo" width="40" height="40">
        <div class="nav-logo-text">
          <span class="brand-top">TrainPark</span>
          <span class="brand-bottom">Ride &amp; Play</span>
        </div>
      </a>
    </div>
    <div class="auth-heading">
      <h1 class="auth-title">Welcome Back!</h1>
      <p class="auth-sub">Don't have an account? <a href="signup.html" id="loginSignupLink">Sign up free</a></p>
    </div>
    <button class="social-btn" id="loginGoogleBtn" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>
      Continue with Google
    </button>
    <div class="auth-divider"><span>or sign in with email</span></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="pw-field">
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password" required style="padding-right:2.75rem">
          <button type="button" class="pw-toggle" id="loginPwToggle" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-meta">
        <label class="form-check"><input type="checkbox" id="loginRemember"> Remember me</label>
        <a href="#" class="forgot-link" id="loginForgotLink">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-full" id="loginSubmitBtn">Sign In</button>
    </form>
  </div>
</div>
<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initDarkMode();
  initPasswordToggle();
  const form = document.getElementById('loginForm');
  if(form) form.addEventListener('submit', e => {
    e.preventDefault();
    const btn = form.querySelector('[type="submit"]');
    btn.textContent = 'Signing in...';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = 'Sign In'; btn.disabled = false; }, 2000);
  });
});
</script>
</body>
</html>
