<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up | TrainPark — Miniature Train Ride Park</title>
<meta name="description" content="Create your Miniature Train Ride Park account to save bookings, receive special discounts, and book party reservations.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<!-- Top Bar -->
<div class="auth-topbar" style="justify-content:flex-end;">
  <div style="display:flex;gap:0.5rem;align-items:center;">
    <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle text direction">
      <span class="dir-label" style="font-size:0.625rem;font-weight:700;">LTR</span>
    </button>
    <button class="auth-toggle-btn auth-theme-toggle" id="darkToggle" title="Toggle Theme" aria-label="Toggle dark mode">
      <svg id="iconSun" class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg id="iconMoon" class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<!-- Card -->
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;">
  <div class="auth-card" style="max-width:480px;">
    <!-- Decorative Ambient Orb -->
    <div style="position:absolute;top:-60px;left:-60px;width:140px;height:140px;background:rgba(44,95,46,0.12);border-radius:50%;filter:blur(30px);pointer-events:none;"></div>

    <!-- Logo -->
    <a href="index.html" class="auth-logo" aria-label="TrainPark Home">
      <img src="logo.svg" alt="TrainPark Logo" width="44" height="44">
      <div class="auth-logo-text">
        <span class="brand-top">TrainPark</span>
        <span class="brand-bottom">Ride &amp; Play</span>
      </div>
    </a>

    <!-- Header -->
    <div style="text-align:center;margin-bottom:1.75rem;">
      <h1 style="font-size:1.5rem;margin-bottom:0.375rem;color:var(--text-heading);font-family:var(--font-heading);">Create Account</h1>
      <p style="font-size:0.875rem;color:var(--text-muted);">Join the TrainPark family</p>
    </div>



    <!-- Form -->
    <form id="signupForm" onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='login.html';">
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="signupFirst">First Name</label>
          <input type="text" id="signupFirst" class="form-input" placeholder="Jane" required autocomplete="given-name">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="signupLast">Last Name</label>
          <input type="text" id="signupLast" class="form-input" placeholder="Smith" required autocomplete="family-name">
        </div>
      </div>
      <div class="form-group" style="margin-top:1.25rem;">
        <label class="form-label" for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" class="form-input" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="signupPhone">Phone Number</label>
        <input type="tel" id="signupPhone" class="form-input" placeholder="+1 (555) 019-2834" required autocomplete="tel">
      </div>
      <div class="form-group">
        <label class="form-label" for="signupPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupPassword" class="form-input" placeholder="Create a password (min 8 chars)" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signupPassword', this)" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signupConfirm">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupConfirm" class="form-input" placeholder="Confirm your password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signupConfirm', this)" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="checkbox-wrapper">
        <label class="form-check" for="signupTerms">
          <input type="checkbox" id="signupTerms" required>
          <span>I agree to the <a href="#" class="link-primary" onclick="event.preventDefault(); alert('Terms of Service: Welcome to TrainPark! All rides subject to park safety rules.');">Terms</a> &amp; <a href="#" class="link-primary" onclick="event.preventDefault(); alert('Privacy Policy: We value and protect your personal information.');">Privacy Policy</a></span>
        </label>
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" id="signupSubmitBtn">Create Account</button>
    </form>

    <!-- Footer link -->
    <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);">
      Already have an account? <a href="login.html" class="link-primary" id="signupLoginLink">Login</a>
    </p>
  </div>
</main>

<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initAuthPage();
});
</script>
</body>
</html>
