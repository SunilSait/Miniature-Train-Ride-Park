<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coming Soon | TrainPark — Miniature Train Ride Park</title>
<meta name="description" content="A new attraction is arriving at Miniature Train Ride Park! Subscribe to get notified when we launch.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div class="auth-topbar">
  <a href="index.html" class="nav-logo" aria-label="Miniature Train Ride Park Home">
    <img src="logo.svg" alt="Train Park Logo" class="nav-logo-img">
    <div class="nav-logo-text">
      <span class="brand-top">TrainPark</span>
      <span class="brand-bottom">Ride &amp; Play</span>
    </div>
  </a>
  <div style="display:flex;gap:0.5rem;align-items:center;">
    <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle text direction">
      <span class="dir-label" style="font-size:0.625rem;font-weight:700;">LTR</span>
    </button>
    <button class="auth-toggle-btn auth-theme-toggle" id="darkToggle" title="Toggle Theme" aria-label="Toggle dark mode">
      <svg id="iconSun" class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg id="iconMoon" class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
  <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
    <!-- Decorative glow -->
    <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px,90vw);height:min(450px,90vw);background:radial-gradient(circle,rgba(44,95,46,0.12),transparent 65%);border-radius:50%;pointer-events:none;"></div>

    <div style="position:relative;z-index:2;">
      <div class="section-label" style="justify-content:center;margin-bottom:1rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4.5C7.5 6 10 5.5 10 5.5"/><path d="M12 15v5s3.03-.55 4.5-2c1.5-1.5 2-4.5 2-4.5"/></svg>
        Under Construction
      </div>
      <h1 class="coming-title">Coming Soon</h1>
      <p class="coming-desc">
        We're building an exciting new attraction for our park. This feature is almost ready to roll out. Subscribe to get notified on opening day!
      </p>

      <!-- Countdown -->
      <div class="countdown-grid" id="countdown" aria-label="Countdown timer">
        <div class="countdown-item">
          <div class="countdown-value" id="cd-days">28</div>
          <div class="countdown-label">Days</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="cd-hours">14</div>
          <div class="countdown-label">Hours</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="cd-mins">36</div>
          <div class="countdown-label">Minutes</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="cd-secs">52</div>
          <div class="countdown-label">Seconds</div>
        </div>
      </div>

      <!-- Subscribe Form -->
      <form class="subscribe-form" id="comingSoonForm" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this attraction opens.'); this.reset();">
        <input type="email" placeholder="your@email.com" aria-label="Email address" required>
        <button type="submit" class="btn btn-primary">Notify Me</button>
      </form>

      <!-- Socials -->
      <div class="coming-socials">
        <a href="#" class="coming-social-link" aria-label="Facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
        <a href="#" class="coming-social-link" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </a>
        <a href="#" class="coming-social-link" aria-label="YouTube">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>
        </a>
        <a href="#" class="coming-social-link" aria-label="X">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
      </div>
    </div>
  </div>
</div>

<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initAuthPage();

  // 30-day live countdown timer
  const targetDate = new Date();
  targetDate.setDate(targetDate.getDate() + 30);

  function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;
    if (diff <= 0) return;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);

    const set = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.textContent = String(val).padStart(2, '0');
    };
    set('cd-days', days);
    set('cd-hours', hours);
    set('cd-mins', mins);
    set('cd-secs', secs);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
});
</script>
</body>
</html>
